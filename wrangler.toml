# Cloudflare Pages project config
# Secrets set via `wrangler pages secret put`:
#   TURNSTILE_SECRET          — Cloudflare Turnstile server-side secret
#   AZURE_TENANT_ID           — Entra ID tenant for MS Graph sendMail
#   AZURE_CLIENT_ID           — "Westside Website Contact Form" app registration
#   AZURE_CLIENT_SECRET       — Client secret (expires 2028-03-24)
#   PLACES_API_KEY            — Places-API-only key for /api/address-suggest/

name = "westside-website"
pages_build_output_dir = "dist"
compatibility_date = "2026-03-24"
